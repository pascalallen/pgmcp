# goreleaser builds every released artifact: six binaries, their archives, the
# Claude Desktop bundle (.mcpb), a checksum file, and the multi-arch ghcr.io
# image the MCP Registry points at.
#
# {{ .Version }} is the tag with its leading "v" stripped, so tag v1.0.0
# produces ghcr.io/pascalallen/pgmcp:1.0.0 and pgmcp_1.0.0.mcpb — the exact
# identifiers server.json declares.
#
# Verify locally without publishing anything (needs Node for the mcpb CLI):
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish,docker
version: 2

project_name: pgmcp

before:
  hooks:
    - go mod download

builds:
  - id: pgmcp
    main: ./cmd/pgmcp
    binary: pgmcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Pin the binary's embedded timestamp to the commit so a rebuild of the
    # same tag is byte-identical.
    mod_timestamp: "{{ .CommitTimestamp }}"

# The darwin arm64 and amd64 builds are joined into one Mach-O for the Claude
# Desktop bundle, because the MCPB manifest can pick a binary per OS but not
# per architecture. replace: false keeps the per-arch archives above as they
# are; the universal binary is not archived on its own (archives filter on the
# build id), it only ever ships inside the bundle.
#
# The post hook is where the bundle is packed: it is the last point in
# goreleaser's pipeline where every binary exists and archives, checksums and
# publish have not yet run, so the .mcpb is checksummed and uploaded like any
# other asset via the extra_files entries below.
universal_binaries:
  - id: pgmcp-darwin-universal
    ids:
      - pgmcp
    name_template: pgmcp
    replace: false
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - cmd: scripts/mcpb-pack.sh {{ .Version }} {{ .Path }}
          output: true

archives:
  - id: pgmcp
    ids:
      - pgmcp
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  extra_files:
    - glob: dist/*.mcpb

changelog:
  use: github

# One image per architecture, then a manifest list joining them. The registry
# verifies OCI ownership by reading io.modelcontextprotocol.server.name off
# the image, so that label must match server.json's "name" exactly.
dockers:
  - id: pgmcp-linux-amd64
    ids:
      - pgmcp
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/pascalallen/pgmcp:{{ .Version }}-amd64"
      - "ghcr.io/pascalallen/pgmcp:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=io.modelcontextprotocol.server.name=io.github.pascalallen/pgmcp"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Read-only Postgres ops/DBA diagnostics: slow queries, EXPLAIN, locks, index and table health."
      - "--label=org.opencontainers.image.source=https://github.com/pascalallen/pgmcp"
      - "--label=org.opencontainers.image.url=https://github.com/pascalallen/pgmcp"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.licenses=MIT"

  - id: pgmcp-linux-arm64
    ids:
      - pgmcp
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/pascalallen/pgmcp:{{ .Version }}-arm64"
      - "ghcr.io/pascalallen/pgmcp:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=io.modelcontextprotocol.server.name=io.github.pascalallen/pgmcp"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Read-only Postgres ops/DBA diagnostics: slow queries, EXPLAIN, locks, index and table health."
      - "--label=org.opencontainers.image.source=https://github.com/pascalallen/pgmcp"
      - "--label=org.opencontainers.image.url=https://github.com/pascalallen/pgmcp"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/pascalallen/pgmcp:{{ .Version }}"
    image_templates:
      - "ghcr.io/pascalallen/pgmcp:{{ .Version }}-amd64"
      - "ghcr.io/pascalallen/pgmcp:{{ .Version }}-arm64"
  - name_template: "ghcr.io/pascalallen/pgmcp:latest"
    image_templates:
      - "ghcr.io/pascalallen/pgmcp:latest-amd64"
      - "ghcr.io/pascalallen/pgmcp:latest-arm64"

release:
  draft: false
  prerelease: auto
  extra_files:
    - glob: dist/*.mcpb
  footer: |
    ## Claude Desktop

    Download `pgmcp_{{ .Version }}.mcpb` above and open it with Claude Desktop
    (macOS universal, Windows x64). It asks for a Postgres connection string
    and stores it in the OS keychain.

    ## Container image

    ```
    docker pull ghcr.io/pascalallen/pgmcp:{{ .Version }}
    ```
